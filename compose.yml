x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:-sqlite:////data/pricelurk.db}
    REDIS_URL: redis://redis:6379/0
    WRITE_API_KEY: ${WRITE_API_KEY:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-5}
    TELEGRAM_ATTEMPTS: ${TELEGRAM_ATTEMPTS:-3}
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    CELERY_QUEUE: ${CELERY_QUEUE:-main-queue}
    MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-3600}
    BROWSER_FALLBACK: ${BROWSER_FALLBACK:-false}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DEMO_MODE: ${DEMO_MODE:-false}
  volumes:
    - data:/data
  init: true
  mem_limit: 1g
  cpus: 1

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *backend
    command: ["python", "-m", "app.db.migrate"]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: ["sh", "-c", "exec celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=1 -Q \"$$CELERY_QUEUE\""]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/data/celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  data:
  redis-data:
